name: Sync Wiki

on:
  push:
    branches: [ "master" ]
    paths:
      - 'docs/**/*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Sync Wiki
        run: ./.github/scripts/sync-wiki.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
